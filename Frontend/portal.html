<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SMCC Live authenticated portal">
  <title>SMCC Live | Workspace</title>
  <style>
    body {
      align-items: center;
      background: #f5f3ee;
      color: #10161f;
      display: grid;
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100svh;
      place-items: center;
    }
    main {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 45px #10221b1a;
      max-width: 500px;
      padding: 40px;
      text-align: center;
      width: min(86vw, 500px);
    }
    p {
      color: #68717d;
      line-height: 1.55;
    }
    button {
      background: #1e3c39;
      border: 0;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      margin-top: 12px;
      padding: 11px 18px;
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <p id="status">Verifying your access…</p>
    <h1 id="greeting" hidden></h1>
    <p id="detail" hidden></p>
    <button id="sign-out" type="button" hidden>Sign out</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="portal.js"></script>
</body>

</html>
